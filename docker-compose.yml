# Milvus 3.0 vs Elasticsearch 9.4 — side-by-side web demo
# One `docker compose up -d` brings up both engines + the browser demo app.
#
# Tags are pinned via .env so you can flip Milvus to another tag without editing
# this file. The `:-` defaults below are the fallback when .env is absent. See .env.
#
# Containers are namespaced by the project name below (mvs-es-lab-<service>-1),
# NOT by explicit container_name -- fixed names like "milvus-etcd" are global on
# the Docker daemon and collide with any other Milvus stack on the same machine.
# Host ports are overridable in .env for the same reason. Address services by
# name (`docker compose exec demo ...`), never by container name.

name: mvs-es-lab

services:
  # ------------------------------------------------------------------ Milvus deps
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ------------------------------------------------------------------ Milvus
  milvus:
    image: milvusdb/milvus:${MILVUS_TAG:-v3.0.0}
    command: ["milvus", "run", "standalone"]
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"           # gRPC / SDK
      - "${MILVUS_METRICS_PORT:-9091}:9091"     # metrics + WebUI at /webui/
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ------------------------------------------------------------------ Elasticsearch
  elasticsearch:
    build:
      context: ./es
      args:
        ES_TAG: "${ES_TAG:-9.4.3}"
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/es:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 5

  # ------------------------------------------------------------------ Demo app
  # The presentation surface, and the container the loaders run inside
  # (`docker compose exec demo python data/load_milvus.py`). Port is bound to
  # 127.0.0.1 deliberately: the app executes arbitrary Python from the browser,
  # which is only defensible because nothing but this laptop can reach it.
  # Uvicorn binds 0.0.0.0 *inside* the container because it must to be reachable
  # through the mapping at all -- the container boundary is what keeps the LAN
  # out. Do not widen this mapping.
  demo:
    build: ./app
    environment:
      - MILVUS_URI=http://milvus:19530
      - ES_URI=http://elasticsearch:9200
      - PYTHONPATH=/workspace
      - MILVUS_TAG=${MILVUS_TAG:-v3.0.0}
      - ES_TAG=${ES_TAG:-9.4.3}
    volumes:
      - ./:/workspace
    working_dir: /workspace
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    depends_on:
      - milvus
      - elasticsearch
    command: >
      uvicorn webapp.server:app --host 0.0.0.0 --port 8080

# No explicit network name: the default network is derived from the project
# name, so a second stack (or another Milvus project) cannot collide with it.
